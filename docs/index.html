<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gouvernement QCM</title>
<meta name="description" content="Gouvernement QCM — L'Indépendance en héritage, la jeunesse en marche, Simandou 2040 en ligne de mire. Cinq quiz de 40 questions : Simandou, Histoire de la Guinée, Armée et Gendarmerie nationale, Bilan du CNRD 2021-2026, Secrétariat général du Gouvernement. Semaine de l'Indépendance, An 68, République de Guinée.">
<link rel="icon" href="assets/armoiries.png" type="image/png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="band">
  <img class="arm" src="assets/armoiries.png" alt="Armoiries de la République de Guinée">
  <div class="rep">République de Guinée</div>
  <div class="motto">Travail · Justice · Solidarité</div>
  <h1>Gouvernement QCM</h1>
  <div class="sub">Semaine de l'Indépendance · Édition An 68 · 25 septembre – 2 octobre 2026</div>
</header>
<main class="wrap">
  <div class="quizbar" id="quizbar" hidden><span id="quizName"></span><span class="who-is" id="whoIs"></span><button class="link" data-landing>Changer de quiz</button></div>
  <div class="rail" id="rail" hidden>
    <div class="lbl"><span id="railFrom"></span><span id="railTo"></span></div>
    <div class="track"><div class="ties"></div><div class="done" id="done"></div><div class="train" id="train"></div></div>
    <div class="km" id="km"></div>
  </div>
  <div id="app"></div>
  <div class="foot"><img src="assets/simandou2040.png" alt="Simandou 2040">Guinée 68 · Semaine de l'Indépendance · 25 sept – 2 oct 2026</div>
</main>
<div id="certRoot"></div>
<script src="js/config.js"></script>
<script src="js/questions.js"></script>
<script src="js/app.js"></script>
</body>
</html>
