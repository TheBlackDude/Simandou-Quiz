name: Déployer le quiz sur Firebase Hosting (quiz.guineen68.com)
# Authentification sans clé (Workload Identity Federation) : voir DEPLOIEMENT.md § 2.7.
on:
  push:
    branches: [main]
    paths: ["docs/**", "firebase.json", ".firebaserc"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: firebase-hosting
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/628990126729/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-hosting-deploy@gouvernement-qcm.iam.gserviceaccount.com
      - run: npm ci --no-audit --no-fund
      - run: npx firebase deploy --only hosting --project gouvernement-qcm --non-interactive
